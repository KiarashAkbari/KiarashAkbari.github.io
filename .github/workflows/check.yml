name: check
on:
  push:
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Local links and assets only (offline), so a dead file like a renamed resume fails CI
      # without external sites making the build flaky.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }} index.html 404.html
          fail: true
